# This is workflow name
name: Hello
# runs on a trigger 
on:
  push:
    branches: [main]
    paths:
      - '**.html'

# These are jobs inside the workflows
jobs: 

# This is the name of the job
  greet: 
# This is github runner, each job runs on a runner 
    runs-on: ubuntu-latest
  
    steps:
      - name: say hello to users
        run: echo "Hello Dosto"

      - name: say hello to username
        run: echo "Hello $USER"

# This job is to check the details 
  version_details:
    runs-on: ubuntu-latest
    steps:
      - name: check python and docker version
        run: docker --version && python --version

  user_detail:
    runs-on: macos-latest
    steps:
      - name: check the user
        run: whoami
  
     
   
   
